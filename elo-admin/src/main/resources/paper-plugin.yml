name: EloAdmin
version: '1.0'
main: com.example.eloadmin.EloAdminPlugin
api-version: '1.21'
description: Menambah/mengurangi/mengatur Elo pemain untuk plugin Neptune

dependencies:
  server:
    Neptune:
      required: true
      load: AFTER
      join-classpath: true

commands:
  elo:
    description: Kelola Elo pemain (add/remove/set)
    usage: /elo <add|remove|set> <player> <jumlah>
    permission: neptune.elo.admin
    permission-message: "§cKamu tidak punya izin untuk perintah ini."

permissions:
  neptune.elo.admin:
    description: Izin untuk mengubah Elo pemain lewat /elo
    default: op
